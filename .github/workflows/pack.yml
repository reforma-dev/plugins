name: Pack catalog

on:
    push:
        branches:
            - main
            - dev
    workflow_dispatch: {}

permissions:
    contents: write

concurrency:
    group: plugins-pack-${{ github.ref_name }}
    cancel-in-progress: true

jobs:
    pack:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.14

            - name: Pack
              run: bun run pack

            - name: Publish catalog-${{ github.sha }}
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  set -euo pipefail
                  TAG="catalog-${GITHUB_SHA}"
                  if gh release view "$TAG" >/dev/null 2>&1; then
                    echo "Release $TAG already exists"
                    exit 0
                  fi
                  # Same SHA on main+dev races two publishes onto one tag. Pin the
                  # commit and treat "already exists" as success.
                  if gh release create "$TAG" dist/catalog.tar.gz \
                    --target "$GITHUB_SHA" \
                    --title "$TAG" \
                    --notes "Marketplace snapshot for ${GITHUB_SHA}"; then
                    exit 0
                  fi
                  gh release view "$TAG"
