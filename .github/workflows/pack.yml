name: Pack catalog

on:
    push:
        branches:
            - main
            - dev
    workflow_dispatch: {}

permissions:
    contents: write

concurrency:
    group: plugins-pack-${{ github.ref_name }}
    cancel-in-progress: true

jobs:
    pack:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.0

            - name: Install
              run: bun install --frozen-lockfile

            - name: Pack
              run: bun run pack
            - name: Publish catalog-${{ github.sha }}
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  CATALOG_KEEP: '10'
              run: |
                  set -euo pipefail
                  SHORT="${GITHUB_SHA:0:7}"
                  TAG="catalog-${SHORT}"
                  if ! gh release view "$TAG" >/dev/null 2>&1; then
                    gh release create "$TAG" dist/catalog.tar.gz \
                      --target "$GITHUB_SHA" \
                      --title "$TAG" \
                      --notes "Marketplace snapshot for ${GITHUB_SHA}" \
                      || gh release view "$TAG"
                  else
                    echo "Release $TAG already exists"
                  fi

                  mapfile -t stale < <(
                    gh release list --limit 100 --json tagName,createdAt \
                      --jq "[.[] | select(.tagName | startswith(\"catalog-\"))]
                        | sort_by(.createdAt)
                        | reverse
                        | .[${CATALOG_KEEP}:]
                        | .[].tagName"
                  )
                  for tag in "${stale[@]}"; do
                    echo "Deleting $tag"
                    gh release delete "$tag" --yes --cleanup-tag || true
                  done
